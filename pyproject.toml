[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bridge"
version = "0.1.0"
description = "Localhost CLI bridge to Grok Bot agents via webhook + reply queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
]

[project.scripts]
grok-bridge = "grok_bridge.daemon:main"
grok-bridge-cli = "grok_bridge.cli.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grok_bridge = ["examples/*"]
